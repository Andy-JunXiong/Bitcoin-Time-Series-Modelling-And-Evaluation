name: Deploy interview showcase to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "interview-site/bitcoin-forecast-intelligence.html"
      - ".github/workflows/deploy-showcase-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare standalone showcase
        shell: bash
        run: |
          mkdir -p _site
          sed "s/__COMMIT_SHA__/${GITHUB_SHA::7}/g" \
            interview-site/bitcoin-forecast-intelligence.html > _site/index.html
          if grep -q "__COMMIT_SHA__" _site/index.html; then
            echo "Commit provenance injection failed" >&2
            exit 1
          fi
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
